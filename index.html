<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Venubee: Book venues in Dhaka</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#1f1a14;--mu:#7a6f62;--ac:#e8a317;--ac2:#a84a08;--bd:#eadfce;--ok:#1f8a4c;--er:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17130e;--card:#221d16;--tx:#f3ece0;--mu:#a89c8b;--bd:#3a3226;--ac2:#f0b04a}}
:root[data-theme=dark]{--bg:#17130e;--card:#221d16;--tx:#f3ece0;--mu:#a89c8b;--bd:#3a3226;--ac2:#f0b04a}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;cursor:pointer}.logo span{color:var(--ac)}
nav{display:flex;gap:6px;flex-wrap:wrap}nav button,.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit}
nav button.on,.chip.on{background:var(--ac);border-color:var(--ac);color:#1f1a14;font-weight:600}
main{max-width:1000px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(120deg,#f6b042,#d9531e);color:#1f1a14;border-radius:16px;padding:24px;margin-bottom:16px}.hero h1{margin:0 0 4px;font-size:26px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card,.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}.card{cursor:pointer}.box{padding:14px;margin-bottom:12px}
.pad{padding:12px 14px}.pad h3,.box h3{margin:0 0 4px}.mu{color:var(--mu);margin:2px 0;font-size:13px}p{margin:4px 0}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.sl{flex:0 0 100%;scroll-snap-align:start;height:150px;display:grid;place-items:center;font-size:54px}
.big .sl{height:230px;font-size:80px}
.opt{display:flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:6px 0;cursor:pointer}
.opt span{flex:1}input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>label{flex:1;min-width:130px;font-size:13px;color:var(--mu)}.row input,.row select{width:100%;display:block;margin-top:2px}
.btn{background:var(--ac);color:#1f1a14;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}.btn.s{padding:5px 10px;font-size:13px}.btn.g{background:transparent;border:1px solid var(--bd);color:var(--tx)}.btn.r{background:var(--er);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.sum div{display:flex;justify-content:space-between;padding:3px 0}.sum .t{border-top:1px solid var(--bd);font-weight:800;margin-top:4px;padding-top:6px}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--bd)}.paid,.completed{color:var(--ok)}.rejected,.expired,.cancelled{color:var(--er)}.accepted{color:var(--ac2)}
.toast{background:var(--ac);color:#1f1a14;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.kpi .box{margin:0}.kpi b{font-size:20px;display:block}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:6px;border-bottom:1px solid var(--bd)}
.note{font-size:12px;color:var(--mu)}
</style></head><body>
<header><div class="logo" onclick="go('home')">Venu<span>bee</span> 🐝</div><nav id="nav"></nav></header>
<main id="app"></main>
<script>
const $=n=>'৳'+Math.round(n).toLocaleString('en-US');
const V=[
{id:1,name:'Skyline Rooftop',cat:'Rooftops',area:'Gulshan',km:3.2,g:['#f6b042','#d9531e'],e:['🌇','🥂','🎶'],rate:20,
 halls:[{id:'a',name:'Sunset Deck',min:10,max:60,rent:12000,look:'Open-air, string lights'},{id:'b',name:'Glass Lounge',min:20,max:150,rent:25000,look:'Enclosed, skyline view'}],
 pk:[{id:'p1',name:'Classic Buffet',price:1000},{id:'p2',name:'Grill Platter',price:1800}],ex:[{id:'e1',name:'Live music',price:6000},{id:'e2',name:'Cake table',price:2500}]},
{id:2,name:'Spice Garden Private Dining',cat:'Restaurants',area:'Dhanmondi',km:5.1,g:['#7bc67e','#2e7d4f'],e:['🍛','🕯️','🌿'],rate:22,
 halls:[{id:'a',name:'Garden Room',min:8,max:30,rent:5000,look:'Cozy, plants and warm light'},{id:'b',name:'Chef’s Table',min:6,max:16,rent:3500,look:'Intimate, open kitchen'}],
 pk:[{id:'p1',name:'Bengali Feast',price:1200},{id:'p2',name:'Chef’s Tasting',price:2400}],ex:[{id:'e1',name:'Balloon décor',price:3000}]},
{id:3,name:'Uttara Grand Convention Hall',cat:'Convention Halls',area:'Uttara',km:14.8,g:['#8e7cf0','#3b2f9b'],e:['💍','🏛️','🎊'],rate:20,
 halls:[{id:'a',name:'Grand Ballroom',min:150,max:800,rent:90000,look:'Chandeliers, stage, 800 seats'},{id:'b',name:'Mini Hall',min:50,max:200,rent:35000,look:'Modern, flexible seating'}],
 pk:[{id:'p1',name:'Wedding Standard',price:850},{id:'p2',name:'Wedding Premium',price:1500}],ex:[{id:'e1',name:'Stage flowers',price:20000},{id:'e2',name:'LED wall',price:15000}]},
{id:4,name:'Lakeview Hotel & Resort',cat:'Hotels & Resorts',area:'Banani',km:2.4,g:['#4fc3f7','#0b5d94'],e:['🏨','🌊','🍽️'],rate:18,
 halls:[{id:'a',name:'Lakeside Terrace',min:20,max:120,rent:40000,look:'Waterfront, evening breeze'},{id:'b',name:'Boardroom',min:10,max:40,rent:15000,look:'Corporate, projector ready'}],
 pk:[{id:'p1',name:'Business Lunch',price:1400},{id:'p2',name:'Gala Dinner',price:2800}],ex:[{id:'e1',name:'Projector and mic',price:4000}]},
{id:5,name:'Mirpur Community Hall',cat:'Community Halls',area:'Mirpur',km:9.6,g:['#f48fb1','#ad1457'],e:['🎂','🎈','👨‍👩‍👧'],rate:20,
 halls:[{id:'a',name:'Hall One',min:20,max:150,rent:12000,look:'Bright, budget friendly'}],
 pk:[{id:'p1',name:'Birthday Basic',price:500},{id:'p2',name:'Family Feast',price:900}],ex:[{id:'e1',name:'Sound system',price:2500}]}];
const CATS=['All',...new Set(V.map(v=>v.cat))];
let D={bk:[],lg:[],rate:20,n:1};
try{const s=localStorage.getItem('vb1');if(s)D=JSON.parse(s)}catch(e){}
D.users=D.users||[];
const save=()=>{try{localStorage.setItem('vb1',JSON.stringify(D))}catch(e){}};
let S={role:'c',view:'home',cat:'All',vid:null,ov:1,msg:''},F={};
const vn=id=>V.find(v=>v.id==id),bk=id=>D.bk.find(b=>b.id==id);
const led=(b,t,a)=>{D.lg.unshift({id:b.id,t,a,at:new Date().toLocaleTimeString()})};
const calc=b=>{const c=Math.round(b.total*b.rate/100);return{c,s:b.total-c}};
const adv=b=>b.adv[0]+b.adv[1];
const msg=m=>{S.msg=m};
function go(v,id){if(S.user&&S.user.role!='c'){S.msg='';render();return}if(v=='mine'&&!S.user){S.view='login';S.msg='Log in to see your bookings.';render();return}S.view=v;if(id){S.vid=id;initF(vn(id))}S.msg='';render();scrollTo(0,0)}
function role(r){S.role=r;S.msg='';render()}
function initF(v){const d=new Date(Date.now()+7*864e5).toISOString().slice(0,10);F={hall:v.halls[0].id,pkg:v.pk[0].id,ex:[],guests:Math.min(v.halls[0].max,Math.max(v.halls[0].min,20)),date:d,time:'19:00',name:S.user?S.user.name:'',phone:S.user?S.user.phone:''}}
function quote(v){const h=v.halls.find(x=>x.id==F.hall),p=v.pk.find(x=>x.id==F.pkg),ex=v.ex.filter(e=>F.ex.includes(e.id)),food=p.price*F.guests,et=ex.reduce((a,e)=>a+e.price,0);return{h,p,ex,food,et,total:h.rent+food+et}}
function scene(v,i){const[a,b]=v.g,id='g'+v.id+i;let s=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="400" height="200" fill="url(#${id})"/>`;
for(let k=0;k<9;k++){const h=40+((k*37+v.id*23+i*41)%60);s+=`<rect x="${k*46-10}" y="${130-h}" width="38" height="${h+70}" fill="#000" opacity=".25"/>`}
s+=`<rect y="140" width="400" height="60" fill="#000" opacity=".4"/>`;
for(let k=0;k<14;k++)s+=`<circle cx="${14+k*28}" cy="${30+Math.sin(k)*(8+i*4)+i*6}" r="3" fill="#fff6c8"/>`;
const n=3+i;for(let k=0;k<n;k++){const x=40+k*(320/n)+((i*17)%20),y=160+(k%2)*14;s+=`<ellipse cx="${x}" cy="${y}" rx="26" ry="8" fill="#fff" opacity=".85"/><rect x="${x-2}" y="${y}" width="4" height="12" fill="#fff" opacity=".6"/><circle cx="${x}" cy="${y-6}" r="5" fill="${a}"/>`}
return s+`<text x="12" y="28" font-size="24">${v.e[i]}</text>`}
const slides=v=>[0,1,2].map(i=>`<div class="sl"><svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" role="img" aria-label="${v.name} photo ${i+1}">${scene(v,i)}</svg></div>`).join('');
function card(v){const ps=v.pk.map(p=>p.price);return `<article class="card"><div class="gal">${slides(v)}</div><div class="pad" onclick="go('venue',${v.id})"><h3>${v.name}</h3><p class="mu">${v.cat} · ${v.area}, Dhaka · ${v.km} km away</p><p><b>${$(Math.min(...ps))}–${$(Math.max(...ps))}</b> <span class="mu">per person</span></p><p class="mu">👥 ${Math.min(...v.halls.map(h=>h.min))}–${Math.max(...v.halls.map(h=>h.max))} guests · swipe photos</p></div></article>`}
function home(){return `<div class="hero"><h1>Find the right place for your event</h1><p>Birthday, wedding or office dinner: compare venues, pick a hall and food package, book in one place.</p></div><div class="chips">${CATS.map(c=>`<button class="chip ${S.cat==c?'on':''}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}</div><div class="grid">${V.filter(v=>S.cat=='All'||v.cat==S.cat).map(card).join('')}</div>`}
function venuePage(){const v=vn(S.vid),q=quote(v);
return `<p><a href="#" onclick="go('home');return false">← All venues</a></p><div class="card big" style="cursor:default"><div class="gal">${slides(v)}</div><div class="pad"><h2 style="margin:0">${v.name}</h2><p class="mu">${v.cat} · ${v.area}, Dhaka · ${v.km} km away</p></div></div><div style="height:12px"></div>
<div class="box"><h3>1. Choose a hall</h3>${v.halls.map(h=>`<label class="opt"><input type="radio" name="h" ${F.hall==h.id?'checked':''} onchange="F.hall='${h.id}';F.guests=Math.min(${h.max},Math.max(${h.min},F.guests));render()"><span><b>${h.name}</b> <span class="mu">${h.look} · ${h.min}–${h.max} guests</span></span><b>${$(h.rent)}</b></label>`).join('')}</div>
<div class="box"><h3>2. Date, time and guests</h3><div class="row"><label>Date<input type="date" value="${F.date}" onchange="F.date=this.value"></label><label>Time<input type="time" value="${F.time}" onchange="F.time=this.value"></label><label>Guests (${q.h.min}–${q.h.max})<input type="number" min="${q.h.min}" max="${q.h.max}" value="${F.guests}" onchange="F.guests=Math.min(${q.h.max},Math.max(${q.h.min},+this.value||${q.h.min}));render()"></label></div></div>
<div class="box"><h3>3. Food package (required, per person)</h3>${v.pk.map(p=>`<label class="opt"><input type="radio" name="p" ${F.pkg==p.id?'checked':''} onchange="F.pkg='${p.id}';render()"><span>${p.name}</span><b>${$(p.price)}</b></label>`).join('')}<h3 style="margin-top:10px">Customizations</h3>${v.ex.map(e=>`<label class="opt"><input type="checkbox" ${F.ex.includes(e.id)?'checked':''} onchange="tog('${e.id}')"><span>${e.name}</span><b>${$(e.price)}</b></label>`).join('')}</div>
<div class="box sum"><h3>Cost summary</h3><div><span>Hall rental</span><span>${$(q.h.rent)}</span></div><div><span>Food ${$(q.p.price)} × ${F.guests}</span><span>${$(q.food)}</span></div><div><span>Customizations</span><span>${$(q.et)}</span></div><div class="t"><span>Total</span><span>${$(q.total)}</span></div></div>
<div class="box"><h3>4. Your details</h3><div class="row"><label>Name<input value="${F.name}" onchange="F.name=this.value"></label><label>Phone<input value="${F.phone}" placeholder="01XXXXXXXXX" onchange="F.phone=this.value"></label></div><p class="note">The owner sees your contact details only after you pay. You pay nothing now: the owner must accept first, then you have 30 minutes to pay.</p><p><button class="btn" onclick="submitReq()">Submit booking request</button></p></div>`}
function tog(id){F.ex=F.ex.includes(id)?F.ex.filter(x=>x!=id):[...F.ex,id];render()}
function submitReq(){if(!S.user){S.back=true;S.view='login';msg('Log in or sign up to send your request.');render();return}const v=vn(S.vid),q=quote(v);F.name=F.name||S.user.name;F.phone=F.phone||S.user.phone;if(!F.date||!F.name||!F.phone){msg('Please fill in date, name and phone.');render();return}
const hrs=Math.max(0,Math.round((new Date(F.date+'T'+F.time)-Date.now())/36e5));
D.bk.push({id:'VB'+(1000+D.n++),vid:v.id,venue:v.name,hall:q.h.name,pkg:q.p.name,price:q.p.price,extras:q.ex.map(e=>e.name).join(', ')||'none',guests:F.guests,g0:F.guests,date:F.date,time:F.time,total:q.total,paid:0,rate:D.rate,vr:v.rate,status:'requested',uid:S.user.id,hrs,name:F.name,phone:F.phone,reduced:0,used:false,adv:[0,0],hold:0,final:null});
save();S.view='mine';msg('Request sent. The owner will review it and you will see the status here.');render()}
const COUNT=b=>b.hold&&Math.max(0,b.hold-Date.now());
const fmt=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function bkCard(b,view){const{c,s}=calc(b);let a='',st=b.status;
let h=`<div class="box"><h3>${b.id} · ${b.venue} <span class="badge ${st}">${st}</span></h3><p>${b.hall} · ${b.pkg} · ${b.guests} guests · ${b.date} ${b.time}</p><p class="mu">Extras: ${b.extras} · Total ${$(b.total)}${b.paid?' · Paid '+$(b.paid):''}</p>`;
if(view=='c'){
 if(st=='requested')a='<p class="mu">Waiting for the owner to accept.</p>';
 if(st=='accepted')a=`<p>Pay within <b class="cd" data-id="${b.id}">${fmt(COUNT(b))}</b> to confirm. The slot is held until then.</p><button class="btn" onclick="pay('${b.id}')">Pay ${$(b.total)} (demo wallet)</button>`;
 if(st=='paid'){const cap=Math.floor(b.g0*.1);a=`<p class="note">Demo: hours until event <select onchange="setH('${b.id}',+this.value)">${[...new Set([72,40,30,20,14,8,3,b.hrs])].sort((x,y)=>y-x).map(x=>`<option ${x==b.hrs?'selected':''}>${x}</option>`).join('')}</select></p>
 <div class="row"><label>Add guests<input type="number" id="inc${b.id}" min="1" value="1"></label><label>&nbsp;<button class="btn s" onclick="incG('${b.id}')">Pay for extra guests</button></label><label>Reduce guests (once, max ${cap})<input type="number" id="red${b.id}" min="1" value="${b.used?0:Math.min(1,cap)}" ${b.used||!cap?'disabled':''}></label><label>&nbsp;<button class="btn s g" onclick="redG('${b.id}')" ${b.used||!cap?'disabled':''}>Reduce</button></label></div>
 <p><button class="btn s r" onclick="cancelB('${b.id}')">Cancel booking (${b.hrs>48?80:b.hrs>=24?60:30}% refund)</button></p>`}
 if(st=='completed')a=`<p class="mu">Final guests ${b.final}. Food refund ${$(b.fr||0)}.</p>`;
}else if(view=='o'){
 if(st=='requested')a=`<button class="btn s" onclick="accept('${b.id}')">Accept</button> <button class="btn s g" onclick="rej('${b.id}')">Reject</button>`;
 if(st=='accepted')a='<p class="mu">Awaiting payment (30 min hold).</p>';
 if(st=='paid'||st=='completed')a=`<p>📞 <b>${b.name}</b> · ${b.phone}</p>`;else a+='<p class="mu">Customer contact hidden until payment.</p>';
 if(st=='paid')a+=`<div class="row"><label>Final guest count<input type="number" id="fin${b.id}" value="${b.guests}"></label><label>&nbsp;<button class="btn s" onclick="finish('${b.id}')">Submit after event</button></label></div>`;
}else{
 a=`<p class="mu">Commission ${b.rate}% = ${$(c)} · Vendor share ${$(s)} · Advances paid ${$(adv(b))}${st=='completed'?' · Final payout '+$(b.fp):''}</p>`;
 if(st=='paid')a+=`<button class="btn s" ${b.hrs>48||b.adv[0]?'disabled':''} onclick="advance('${b.id}',0)">Release 20% (${$(s*.2)})</button> <button class="btn s" ${b.hrs>24||b.adv[1]?'disabled':''} onclick="advance('${b.id}',1)">Release 30% (${$(s*.3)})</button> <span class="note">hrs to event: ${b.hrs}</span>`}
return h+a+'</div>'}
function mine(){const mb=D.bk.filter(b=>S.user&&b.uid==S.user.id);return `<h2>My bookings</h2>${mb.length?[...mb].reverse().map(b=>bkCard(b,'c')).join(''):'<p class="mu">No bookings yet. Pick a venue to start.</p>'}`}
function owner(){const l=D.bk.filter(b=>b.vid==S.ov).reverse();return `<h2>Owner portal</h2><p><b>${vn(S.ov).name}</b></p><p class="note">Owners cannot edit listings or prices. Changes go through the Venubee team.</p>${l.length?l.map(b=>bkCard(b,'o')).join(''):'<p class="mu">No requests for this venue.</p>'}`}
function admin(){const sum=t=>D.lg.filter(x=>x.t==t).reduce((a,x)=>a+x.a,0);const liab=D.bk.filter(b=>['paid','completed'].includes(b.status)).reduce((a,b)=>a+calc(b).s,0)-sum('Vendor payout');
return `<h2>Admin</h2><div class="kpi"><div class="box"><span class="mu">Collected</span><b>${$(sum('Payment'))}</b></div><div class="box"><span class="mu">Refunds</span><b>${$(sum('Refund'))}</b></div><div class="box"><span class="mu">Vendor payouts</span><b>${$(sum('Vendor payout'))}</b></div><div class="box"><span class="mu">Owed to vendors</span><b>${$(Math.max(0,liab))}</b></div></div>
<div class="box"><h3>Commission rate</h3><input type="number" min="0" max="50" value="${D.rate}" onchange="D.rate=+this.value;save()"> % <span class="note">applies to new bookings; each booking keeps its own snapshot</span></div>
<h3>Bookings and payouts</h3>${D.bk.length?[...D.bk].reverse().map(b=>bkCard(b,'a')).join(''):'<p class="mu">None yet.</p>'}
<h3>Ledger</h3><div class="box wrap"><table><tr><th>Time</th><th>Booking</th><th>Entry</th><th>Amount</th></tr>${D.lg.map(x=>`<tr><td>${x.at}</td><td>${x.id}</td><td>${x.t}</td><td>${$(x.a)}</td></tr>`).join('')||'<tr><td colspan=4 class="mu">Empty</td></tr>'}</table></div><p><button class="btn s g" onclick="D={bk:[],lg:[],rate:20,n:1};save();render()">Reset demo data</button></p>`}
function accept(id){const b=bk(id);b.status='accepted';b.hold=Date.now()+30*6e4;save();render()}
function rej(id){bk(id).status='rejected';save();render()}
function pay(id){const b=bk(id);if(COUNT(b)<=0){b.status='expired'}else{b.status='paid';b.paid=b.total;led(b,'Payment',b.total);msg('Payment received. Booking '+id+' is confirmed.')}save();render()}
function setH(id,h){bk(id).hrs=h;save();render()}
function incG(id){const b=bk(id),n=+document.getElementById('inc'+id).value,v=vn(b.vid),mx=v.halls.find(h=>h.name==b.hall).max;
if(b.hrs<12)return say('Changes must be made at least 12 hours before the event.');if(!(n>0)||b.guests+n>mx)return say('Exceeds hall capacity ('+mx+').');
const x=n*b.price;b.guests+=n;b.total+=x;b.paid+=x;led(b,'Payment',x);say('Added '+n+' guests. Paid '+$(x)+' extra.')}
function redG(id){const b=bk(id),n=+document.getElementById('red'+id).value,cap=Math.floor(b.g0*.1);
if(b.used)return say('Only one reduction per order.');if(n>cap)return say('Maximum reduction is '+cap+' guests (10%). For more, contact customer service.');if(!(n>0))return say('Enter a number.');
if(b.hrs<16)return say('Within 16 hours, reductions are settled after the event via the final guest count.');
const pct=b.hrs>24?1:.6,r=Math.round(n*b.price*pct);b.guests-=n;b.reduced=n;b.used=true;b.total-=r;b.paid-=r;led(b,'Refund',r);say('Reduced by '+n+'. Refund '+$(r)+' ('+pct*100+'% of unused food).')}
function cancelB(id){const b=bk(id),p=b.hrs>48?.8:b.hrs>=24?.6:.3,r=Math.round(b.paid*p);b.status='cancelled';led(b,'Refund',r);b.paid-=r;say('Cancelled. Refund '+$(r)+'; retained '+$(b.paid)+'.')}
function finish(id){const b=bk(id),n=+document.getElementById('fin'+id).value,cap=Math.floor(b.g0*.1);
const sh=Math.max(0,b.guests-n),ok=Math.min(sh,Math.max(0,cap-b.reduced)),r=Math.round(ok*b.price*b.vr/100);
b.final=n;b.fr=r;b.total-=r;b.paid-=r;if(r)led(b,'Refund',r);b.status='completed';const s=calc(b).s;b.fp=Math.max(0,s-adv(b));led(b,'Vendor payout',b.fp);
say('Reconciled. Refundable no-shows: '+ok+' of '+sh+' (capped at 10%). Final payout '+$(b.fp)+'.')}
function advance(id,i){const b=bk(id),a=Math.round(calc(b).s*(i?.3:.2));b.adv[i]=a;led(b,'Vendor payout',a);say('Advance released: '+$(a))}
function say(m){msg(m);save();render()}
const sv=v=>{S.view=v;S.msg='';render()};
function auth(){const su=S.view=='signup';return `<div class="box" style="max-width:380px;margin:20px auto"><h2 style="margin-top:0">${su?'Create your account':'Log in'}</h2><div class="row" style="flex-direction:column">${su?'<label>Full name<input id="an"></label>':''}<label>${su?'Phone':'Phone or username'}<input id="ap"></label><label>Password<input id="aw" type="password"></label></div><p><button class="btn" onclick="${su?'signup()':'login()'}">${su?'Sign up':'Log in'}</button></p><p class="note">${su?'Have an account? <a href="#" onclick="sv(&quot;login&quot;);return false">Log in</a>':'New here? <a href="#" onclick="sv(&quot;signup&quot;);return false">Sign up</a><br>Demo staff logins: owner / owner123 (Skyline Rooftop), admin / admin123. Demo only, not real security.'}</p></div>`}
function enter(u){S.user=u;S.role=u.role;if(u.role=='o')S.ov=u.vid;S.view=u.role=='c'&&S.back&&S.vid?'venue':'home';S.back=false;if(u.role=='c'&&F&&F.guests){F.name=u.name;F.phone=u.phone}msg('Welcome, '+u.name+'.');render();scrollTo(0,0)}
function login(){const p=document.getElementById('ap').value.trim(),w=document.getElementById('aw').value;const u=[{id:'own',name:'Skyline Owner',phone:'owner',pw:'owner123',role:'o',vid:1},{id:'adm',name:'Venubee Admin',phone:'admin',pw:'admin123',role:'a'},...(D.users||[])].find(x=>x.phone==p&&x.pw==w);if(!u){msg('Wrong phone/username or password.');render();return}enter(u)}
function signup(){const n=document.getElementById('an').value.trim(),p=document.getElementById('ap').value.trim(),w=document.getElementById('aw').value;D.users=D.users||[];if(!n||p.length<6||w.length<4){msg('Enter your name, a phone number and a password (4+ characters).');render();return}if(D.users.some(x=>x.phone==p)||p=='owner'||p=='admin'){msg('That phone is already registered. Please log in.');render();return}const u={id:'U'+Date.now(),name:n,phone:p,pw:w,role:'c'};D.users.push(u);save();enter(u)}
function logout(){S.user=null;S.role='c';S.view='home';msg('Logged out.');render()}
function render(){D.bk.forEach(b=>{if(b.status=='accepted'&&COUNT(b)<=0)b.status='expired'});
document.getElementById('nav').innerHTML=S.user?(S.role=='c'?`<button class="${S.view=='mine'?'on':''}" onclick="go('mine')">My bookings</button>`:`<button class="on">${S.role=='o'?'Owner portal':'Admin'}</button>`)+`<span class="mu">${S.user.name}</span><button onclick="logout()">Log out</button>`:`<button class="${S.view=='login'?'on':''}" onclick="sv('login')">Log in</button><button class="btn s" onclick="sv('signup')">Sign up</button>`;
document.getElementById('app').innerHTML=(S.msg?`<div class="toast">${S.msg}</div>`:'')+(S.view=='login'||S.view=='signup'?auth():S.role=='o'?owner():S.role=='a'?admin():S.view=='venue'?venuePage():S.view=='mine'?mine():home())}
setInterval(()=>{document.querySelectorAll('.cd').forEach(e=>{const b=bk(e.dataset.id);if(!b)return;if(COUNT(b)<=0){render()}else e.textContent=fmt(COUNT(b))})},1000);
render();
</script></body></html>
